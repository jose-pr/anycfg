# examples/advanced.yaml, loaded by run_advanced.py.

# 1. Plain values.
app_name: "Anycfg Demo"
version: "1.0.0"

# 2. Interpolation: rendered once the whole document is loaded, when the
#    loader is created with interpolate=True.
welcome_message: "Welcome to {{ app_name }} v{{ version }}"

# 3. One source as a value. Relative paths resolve against this file.
editor_settings: !include settings.json

# 4. Several sources, merged in order with the strategy named here.
merged: !include {pathname: [includeme.yaml, local.yaml], merge: deep}

# 5. A glob that matches nothing gives the default instead.
optional: !include {pathname: "conf.d/*.yaml", default: {enabled: false}}

# 6. Environment variables: Loader(inject_env=True) puts a read-only snapshot
#    of os.environ in scope as `env`.
# system_user: "{{ env.USER }}"
