# The base layer of the layered demo in example.py; hiera.yaml is merged over it.
#
# `!include` pulls another document in as a value, whatever its format. A
# relative path resolves against THIS file, so the demo runs from any directory.
app:
  name: demo
  root: /srv/demo

# Rendered once, after the layers are merged, so it follows hiera.yaml's root.
log_dir: "{{ app.root }}/logs"

server:
  host: localhost
  port: 8080

# A JSON document as a value.
editor: !include settings.json

# An INI document as a value. Its `logs` option refers to `log_dir` above.
ini: !include test.ini
