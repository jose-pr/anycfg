site_name: anycfg
site_description: Load, layer and write configuration in any registered format, with includes, typed hydration and a trust policy that is untrusted by default.
site_url: https://jose-pr.github.io/anycfg/
repo_url: https://github.com/jose-pr/anycfg
repo_name: jose-pr/anycfg
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - content.code.copy

nav:
  - Home: index.md
  - Guide:
      - Formats: guide/formats.md
      - Sources: guide/sources.md
      - Merging: guide/merging.md
      - Includes: guide/includes.md
      - Templating: guide/templating.md
      - Typed results: guide/models.md
      - Async: guide/async.md
      - Security: guide/security.md
      - Migrating: guide/migrating.md
  - API Reference:
      - Overview: api/reference.md
      - Loading: api/loading.md
      - Policy and context: api/policy.md
      - Formats: api/formats.md
      - Sources: api/sources.md
      - Merging and typed results: api/merging.md
      - Interpolation: api/templating.md
      - Exceptions: api/exceptions.md
      - Testing: api/testing.md
  - Changelog: changelog.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            merge_init_into_class: true
            show_if_no_docstring: true

markdown_extensions:
  - admonition
  - tables
  - pymdownx.snippets:
      base_path: ["."]
  - pymdownx.superfences
