name: Test

# On-demand / ad-hoc test workflow, kept separate from release.yml's own
# release-gate test job so it can be run without cutting a release. Two ways
# to trigger it:
#   - workflow_dispatch (optionally against a specific ref), for manual runs.
#   - push of a tag matching "ci-*" (throwaway tag, delete after) so an agent
#     without dashboard access can trigger + poll a run via the API/CLI.
# Not triggered by push/PR on branches by default -- add that only if the
# project actually wants CI on every commit.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test (branch, tag, or SHA)"
        required: false
        default: ""
  push:
    tags:
      - "ci-*"

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every supported interpreter on Linux, plus both ends of the range on
        # Windows and macOS.
        include:
          - os: ubuntu-latest
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.9"
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with all extras
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q -rs

  # What ships: the built wheel, with no extra. It must import without any
  # optional dependency and name the extra a format needs when it is used.
  bare-wheel:
    name: Bare wheel install (py3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Build the wheel
        run: |
          python -m pip install --upgrade build
          python -m build --wheel --outdir "$RUNNER_TEMP/dist" .
      - name: Install it alone and check it
        run: |
          python -m venv "$RUNNER_TEMP/bare"
          "$RUNNER_TEMP/bare/bin/python" -m pip install "$RUNNER_TEMP"/dist/*.whl
          "$RUNNER_TEMP/bare/bin/python" -I .github/scripts/bare_install_check.py

  # Hydration into a real Pydantic model, which the default install leaves out.
  pydantic:
    name: Test with pydantic (py3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install package with all extras and pydantic
        run: python -m pip install -e ".[dev]" pydantic
      - name: Run tests
        run: python -m pytest -q -rs

  # The declared floors, not the newest releases: an unexercised lower bound is
  # a guess. The pins are derived from the installed metadata at job time, so
  # pyproject.toml stays the only place they are written down.
  test-floors:
    name: Test lowest declared dependencies (py3.9)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install pip and packaging
        run: python -m pip install --upgrade pip packaging
      - name: Install the package without its dependencies
        run: python -m pip install --no-deps -e .
      - name: Derive the floor constraints
        run: |
          python .github/scripts/floor_constraints.py yaml toml templates > "$RUNNER_TEMP/floors.txt"
          cat "$RUNNER_TEMP/floors.txt"
      - name: Install at the floors
        run: python -m pip install -c "$RUNNER_TEMP/floors.txt" -e ".[yaml,toml,templates]" pytest
      - name: Show what resolved
        run: python -m pip list
      - name: Run tests
        run: python -m pytest -q -rs
