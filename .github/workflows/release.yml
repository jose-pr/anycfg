name: Release

# Runs when a version tag (e.g. v1.0.0, v1.0.0-rc.1) is pushed. Not wired to
# push/PR events on branches -- this is a release gate, not general CI.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: Test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with all extras
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q -rs

  # The declared floors, not the newest releases: an unexercised lower bound is
  # a guess. The pins are derived from the installed metadata at job time, so
  # pyproject.toml stays the only place they are written down.
  test-floors:
    name: Test lowest declared dependencies (py3.9)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install pip and packaging
        run: python -m pip install --upgrade pip packaging
      - name: Install the package without its dependencies
        run: python -m pip install --no-deps -e .
      - name: Derive the floor constraints
        run: |
          python .github/scripts/floor_constraints.py yaml toml templates > "$RUNNER_TEMP/floors.txt"
          cat "$RUNNER_TEMP/floors.txt"
      - name: Install at the floors
        run: python -m pip install -c "$RUNNER_TEMP/floors.txt" -e ".[yaml,toml,templates]" pytest
      - name: Show what resolved
        run: python -m pip list
      - name: Run tests
        run: python -m pytest -q -rs

  build:
    name: Build distribution
    needs: [test, test-floors]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install build tooling
        run: python -m pip install --upgrade build
      - name: Build sdist and wheel
        run: python -m build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # A gate, not a deploy: a broken docs build reddens the release run and
  # blocks docs-dispatch, but never blocks build/publish. docs.yml owns Pages.
  docs-gate:
    name: Build documentation (gate)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install package with docs tooling
        run: python -m pip install -e ".[dev,docs]"
      - name: Build docs
        run: mkdocs build --strict

  github-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Extract CHANGELOG.md section for this tag
        shell: python
        run: |
          import pathlib
          import re
          import sys

          tag = "${{ github.ref_name }}"
          version = tag[1:] if tag.startswith("v") else tag  # v1.0.0-rc.1 -> 1.0.0-rc.1

          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          # Stop before the next "## [version]" heading, or before the
          # trailing "[version]: https://..." reference-link block at the
          # end of the file (only relevant when this tag is the oldest
          # tracked release, so there's no next heading to stop at).
          match = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|^\[[^\]]+\]:\s|\Z)",
              changelog,
              re.DOTALL | re.MULTILINE,
          )
          if not match:
              sys.exit(f"No CHANGELOG.md section found for version {version!r}")
          pathlib.Path("release_notes.md").write_text(match.group(1).strip() + "\n", encoding="utf-8")
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          # A repo that pushes commits directly (no PR flow) gets a thin/empty
          # auto-generated "What's Changed" on every release, not just the
          # first -- the scraped CHANGELOG.md section is the real notes.
          # generate_release_notes still runs and appends its own
          # "Full Changelog: <compare link>" line after body_path's content.
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: release_notes.md
          # Pin the release to the tagged commit; without it GitHub attaches
          # the release to the default branch's tip.
          target_commitish: ${{ github.sha }}

  publish-pypi:
    name: Publish to PyPI
    needs: github-release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/anycfg/
    permissions:
      id-token: write # required for PyPI Trusted Publishing (OIDC)
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A partially completed publish can be re-run instead of failing on
          # the files PyPI already has.
          skip-existing: true

  # A release created with the workflow token starts no `release: published`
  # run, so the docs deploy has to be asked for explicitly. workflow_dispatch
  # is GitHub's documented exception to that rule.
  docs-dispatch:
    name: Dispatch the docs deployment
    needs: [github-release, docs-gate]
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Trigger docs.yml for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
