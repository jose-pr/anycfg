[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anycfg"
version = "0.15.1"
authors = [{ name = "Jose A" }]
description = "Another Config lib for python, basically load config/yaml/toml/... files and add some features like relative import and templating."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "pathapi>=0.1.0,<0.2",
    # TOML reads everywhere: tomllib is in the standard library from 3.11.
    "tomli>=2.0,<3; python_version < '3.11'",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0,<7"]
toml = ["tomli-w>=1.0,<2"]
# 0.2: eval takes a whole value and keeps one expression's type,
# Template.is_template, and a sandbox that bounds what a value may allocate.
templates = ["tplx[jinja]>=0.2.0,<0.3"]
all = ["anycfg[yaml,toml,templates]"]
dev = ["anycfg[all]", "pytest", "build", "hatchling", "twine", "black"]
docs = ["mkdocs", "mkdocs-material", "mkdocstrings[python]"]

[project.urls]
Homepage = "https://github.com/jose-pr/anycfg/"
Documentation = "https://jose-pr.github.io/anycfg/"
Issues = "https://github.com/jose-pr/anycfg/issues"


# Ship the consumer-facing docs inside the installed package, so they are
# readable from site-packages via importlib.resources without the repo.
# src/anycfg/AGENTS.md is included automatically by living in the package
# dir. The repo-root AGENTS.md is contributor orientation and is excluded from
# both artifacts (see the sdist exclude below; the wheel only packs src/).
[tool.hatch.build.targets.wheel.force-include]
"README.md" = "anycfg/README.md"

# Each target needs its OWN exclude list: hatchling reads
# tool.hatch.build.targets.<target>.exclude instead of tool.hatch.build.exclude
# whenever the target defines one, so a global "*.local.*" would not reach these.
[tool.hatch.build.targets.sdist]
exclude = ["/.*", "/AGENTS.md", "/benchmarks", "*.local.*"]

[tool.hatch.build.targets.wheel]
packages = ["src/anycfg"]
exclude = ["*.local.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# black itself needs Python 3.10+ from version 26 on, so the 3.9 floor venv
# keeps an older one; run the formatter from the 3.14 venv (see AGENTS.md).
# Pinned to the project's MINIMUM supported Python so black never emits syntax
# the floor cannot parse.
[tool.black]
target-version = ["py39"]

